name: Snapshot Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: snapshot-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync snapshot
        env:
          COMMAND_CENTER_LIVE_SYNC_CMD: ${{ secrets.COMMAND_CENTER_LIVE_SYNC_CMD }}
          COMMAND_CENTER_OPS_ROOT: ${{ vars.COMMAND_CENTER_OPS_ROOT }}
          COMMAND_CENTER_SNAPSHOT_SOURCE_URL: ${{ secrets.COMMAND_CENTER_SNAPSHOT_SOURCE_URL }}
        run: |
          bash ./scripts_sync_snapshot.sh

      - name: Validate snapshot.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('snapshot.json')
          if not p.exists():
            raise SystemExit('snapshot.json missing after sync')
          data = json.loads(p.read_text())
          if not isinstance(data, dict):
            raise SystemExit('snapshot.json must be a JSON object')
          print('generatedAt=', data.get('generatedAt'))
          PY

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -m "chore(snapshot): sync automated snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Snapshot updated and pushed."
          else
            echo "No snapshot changes."
          fi
