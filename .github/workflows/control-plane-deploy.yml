name: Control Plane Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-deploy.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Fly token is configured
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "Missing required secret: FLY_API_TOKEN"
            exit 1
          fi

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy control-plane
        run: flyctl deploy --config fly.toml --remote-only
